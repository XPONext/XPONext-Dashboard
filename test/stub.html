function wochenStart(){
  const d = new Date();
  const versatz = (d.getDay() + 6) % 7;   // Montag = 0
  d.setDate(d.getDate() - versatz);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function tagRelativ(n){
  const d = new Date(); d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

let idZaehler = 100;
window.__schreibfehler = false;   // Schalter fuer den Fehlerfall im Test
function result(table){
  // Kleiner Speicher statt reiner Attrappe: Geschriebenes landet wirklich in
  // FAKE und kommt beim naechsten Lesen zurueck. Nur so laesst sich pruefen,
  // ob eine Ansicht nach dem Speichern auch neu zeichnet — genau daran ist
  // der Umsatz-Dialog gescheitert.
  //
  // Ausgefuehrt wird erst in then(), nicht beim Aufruf: Im echten Client
  // steht .update(...) VOR .eq(...), der Filter ist zum Zeitpunkt des
  // update-Aufrufs also noch gar nicht bekannt.
  if(!FAKE[table]) FAKE[table] = [];
  const tabelle = FAKE[table];
  const filter = [];
  let aktion = null, nutzlast = null;

  const passt = (zeile)=> filter.every(([feld, wert])=> String(zeile[feld]) === String(wert));

  function ausfuehren(){
    if(aktion === "insert" || aktion === "upsert"){
      const neu = Object.assign(
        { id: "neu"+(++idZaehler), created_at: new Date().toISOString() }, nutzlast);
      tabelle.push(neu);
      return [neu];
    }
    if(aktion === "update"){
      const geaendert = [];
      tabelle.forEach((z, i)=>{
        if(passt(z)){ Object.assign(tabelle[i], nutzlast); geaendert.push(tabelle[i]); }
      });
      return geaendert;
    }
    if(aktion === "delete"){
      const weg = tabelle.filter(passt);
      const bleiben = tabelle.filter(z=>!passt(z));
      tabelle.length = 0; tabelle.push(...bleiben);
      return weg;
    }
    return tabelle.filter(passt);          // lesend
  }

  const chain = {
    select: ()=>chain, order: ()=>chain, limit: ()=>chain, single: ()=>chain,
    eq: (feld, wert)=>{ filter.push([feld, wert]); return chain; },
    insert: (row)=>{ aktion = "insert"; nutzlast = row; return chain; },
    upsert: (row)=>{ aktion = "upsert"; nutzlast = row; return chain; },
    update: (row)=>{ aktion = "update"; nutzlast = row; return chain; },
    delete: ()=>{ aktion = "delete"; return chain; },
    then: (res)=>Promise.resolve(
      window.__schreibfehler && aktion
        ? { data: null, error: { message: "Testfehler beim Schreiben", code: "42501" } }
        : { data: JSON.parse(JSON.stringify(ausfuehren())), error: null }
    ).then(res)
  };
  return chain;
}
window.supabase = { createClient: ()=>({ from: result }) };

/* Dialoge pruefen: oeffnen, Pflichtfeld leer absenden, Werte setzen, speichern.
   Ohne diesen Teil wuerde der Test den Modal-Helfer gar nicht anfassen. */
window.__dialogChecks = [];
function pruefeDialog(name, bedingung){ window.__dialogChecks.push(name + (bedingung ? ": ok" : ": FEHLGESCHLAGEN")); }

setTimeout(async ()=>{
  // Der visuelle Vergleich setzt dieses Flag: er will die Seite im Ruhestand
  // fotografieren, nicht mit geoeffneten Dialogen und Fehlerbanner.
  if(window.__nurAnsicht) return;
  try{
    document.getElementById("openAddTaskBtn").click();
    await new Promise(r=>setTimeout(r, 60));
    const dlg = document.querySelector("dialog.dlg[open]");
    pruefeDialog("Dialog oeffnet", !!dlg && dlg.open);
    pruefeDialog("Felder gebaut", !!dlg.querySelector('[name="text"]') && !!dlg.querySelector('[name="priority"]'));
    pruefeDialog("Erstes Feld fokussiert", document.activeElement === dlg.querySelector('[name="text"]'));

    // Pflichtfeld leer -> Meldung im Dialog, Dialog bleibt offen

    await new Promise(r=>setTimeout(r, 60));
    const fehler = dlg.querySelector(".dlg-error");

    // Ausfuellen und speichern
    dlg.querySelector('[name="text"]').value = "Testaufgabe";
    dlg.querySelector('[data-dlg="submit"]').click();
    await new Promise(r=>setTimeout(r, 120));
    pruefeDialog("Dialog schliesst nach Speichern", document.querySelectorAll("dialog.dlg[open]").length === 0);

    // Bearbeiten-Dialog mit vorbelegten Werten
    document.querySelector(".kanban-card").click();
    await new Promise(r=>setTimeout(r, 80));
    const dlg2 = document.querySelector("dialog.dlg[open]");
    pruefeDialog("Bearbeiten vorbelegt", !!dlg2 && dlg2.querySelector('[name="text"]').value.length > 0);
    pruefeDialog("Loeschen wird angeboten", !!dlg2.querySelector('[data-dlg="delete"]'));
    // Loeschen -> Rueckfrage. Kritischer Fall: beide Dialoge teilten sich
    // frueher ein einziges <dialog>, wodurch die Rueckfrage den aeusseren
    // Dialog zerstoert hat.
    dlg2.querySelector('[data-dlg="delete"]').click();
    await new Promise(r=>setTimeout(r, 80));
    const offene = document.querySelectorAll("dialog.dlg[open]");
    pruefeDialog("Rueckfrage oeffnet zusaetzlich", offene.length === 2);
    const frage = offene[offene.length-1];
    pruefeDialog("Rueckfrage zeigt den Text", /l\u00f6schen/i.test(frage.textContent));

    // Abbrechen in der Rueckfrage: der Bearbeiten-Dialog muss offen bleiben
    frage.querySelector('[data-dlg="nein"]').click();
    await new Promise(r=>setTimeout(r, 120));
    const nochOffen = document.querySelectorAll("dialog.dlg[open]");
    pruefeDialog("Bearbeiten-Dialog ueberlebt die Rueckfrage", nochOffen.length === 1);
    pruefeDialog("Eingaben bleiben erhalten", nochOffen.length === 1 && !!nochOffen[0].querySelector('[name="text"]'));

    // Abbruch schliesst
    if(nochOffen.length) nochOffen[0].querySelector('[data-dlg="abbruch"]').click();
    await new Promise(r=>setTimeout(r, 80));
    pruefeDialog("Abbruch schliesst", document.querySelectorAll("dialog.dlg[open]").length === 0);
    // Fehlgeschlagenes Speichern: keine Bestaetigung, sichtbare Meldung.
    window.__schreibfehler = true;
    document.getElementById("saveWeekBtn").click();
    await new Promise(r=>setTimeout(r, 250));
    const bestaetigung = document.getElementById("saveMsg");
    const banner = document.getElementById("errorBanner");
    pruefeDialog("Fehlschlag zeigt keine Bestaetigung", bestaetigung.style.display !== "block");
    pruefeDialog("Fehlschlag meldet sich sichtbar", !!banner && banner.style.display !== "none" && /fehlgeschlagen|Testfehler/i.test(banner.textContent));
    window.__schreibfehler = false;

    // ---- Kunden-Ansicht ----
    document.querySelector('[data-view="kunden"]').click();
    await new Promise(r=>setTimeout(r, 250));
    const lohnBadges = [...document.querySelectorAll("#kdList .lohn-badge")].map(e=>e.textContent);
    pruefeDialog("Kundenliste gefuellt", lohnBadges.length === 2);
    // Protours 3000 EUR / 1,5 Std. = 2.000 EUR/Std. -> gruen
    pruefeDialog("Stundenlohn Protours stimmt", /2\.000/.test(lohnBadges[0] || ""));
    pruefeDialog("Bester Kunde steht oben", !!document.querySelector("#kdList .lohn-badge.lohn-ok"));
    // Chuong 800 EUR / 20 Std. = 40 EUR/Std. -> rot

    pruefeDialog("Ampelschwellen werden genannt", /50/.test(document.getElementById("kdSchnittSub").textContent));
    pruefeDialog("Umsatzeintraege sind aufgelistet", document.querySelectorAll('#kdRevenues [data-kd="rev-edit"]').length === 2);

    const dlgJetzt = ()=>document.querySelector("dialog.dlg[open]");
    const warte = (ms)=>new Promise(r=>setTimeout(r, ms));
    // Auf die Bedingung warten statt auf die Uhr. Feste Wartezeiten haben hier
    // wiederholt Fehler gemeldet, die keine waren — und wuerden umgekehrt
    // echte Fehler verdecken, sobald etwas langsamer wird.
    const bisWahr = async (fn, maxMs = 5000)=>{
      const ende = Date.now() + maxMs;
      while(Date.now() < ende){ if(fn()) return true; await warte(50); }
      return false;
    };

    // Der Betrag in der Kundenzeile muss direkt in den Eintrag fuehren.
    const betrag = document.querySelector('#kdList [data-kd="rev-of"]');

    betrag.click();
    await bisWahr(()=>!!dlgJetzt());
    const direkt = dlgJetzt();

      !!direkt && /Umsatz bearbeiten/.test(direkt.textContent));
    direkt.querySelector('[data-dlg="abbruch"]').click();
    // Warten, bis der Dialog wirklich weg ist — sonst greift der naechste
    // Schritt noch auf den alten zu.
    await bisWahr(()=>!dlgJetzt());

    document.querySelector('#kdRevenues [data-kd="rev-edit"]').click();
    await bisWahr(()=>!!dlgJetzt());
    let revDlg = dlgJetzt();

    // Speichern muss die Liste sichtbar aktualisieren. Genau das fehlte: Der

    const vorher = document.querySelectorAll('#kdRevenues [data-kd="rev-edit"]').length;
    revDlg.querySelector('[name="amount"]').value = "4242";
    revDlg.querySelector('[data-dlg="submit"]').click();
    pruefeDialog("Dialog schliesst nach dem Speichern", await bisWahr(()=>!dlgJetzt()));

    document.querySelector('#kdRevenues [data-kd="rev-edit"]').click();
    await bisWahr(()=>!!dlgJetzt());

    await bisWahr(()=>!dlgJetzt());

    // Kunde bearbeiten: der Sichtbarkeitsschalter muss da sein und darf sich
    // beim Speichern nicht von selbst umstellen.
    document.querySelector('#kdList [data-kd="edit"]').click();
    await bisWahr(()=>!!dlgJetzt());
    const kdDlg = dlgJetzt();
    pruefeDialog("Kunden-Dialog hat den Popup-Schalter", !!kdDlg.querySelector('[name="active"]'));
    kdDlg.querySelector('[data-dlg="abbruch"]').click();
    await new Promise(r=>setTimeout(r, 80));

    // ---- Projekte ----
    document.querySelector('[data-view="projekte"]').click();

    pruefeDialog("Laufende Projekte gezaehlt", document.getElementById("projStatActive").textContent === "1");

    pruefeDialog("Verknuepfte Aufgabe wird genannt", /offene Aufgabe/.test(document.getElementById("projectsList").textContent));
    pruefeDialog("Abgeschlossenes Projekt ausgeblendet", !/Altes Projekt/.test(document.getElementById("projectsList").textContent));
    document.getElementById("prFilter").value = "alle";
    document.getElementById("prFilter").dispatchEvent(new Event("change"));
    await new Promise(r=>setTimeout(r, 120));
    pruefeDialog("Filter 'alle' zeigt es wieder", /Altes Projekt/.test(document.getElementById("projectsList").textContent));
    // Der Testtitel enthaelt <b>2026</b>. Maskiert heisst: im Markup steht die
    // Entity, und es gibt kein echtes <b>-Element in der Projektliste.
    const projHtml = document.getElementById("projectsList").innerHTML;
    pruefeDialog("Projekttitel wird maskiert",
      projHtml.includes("&lt;b&gt;2026&lt;/b&gt;") &&
      document.querySelectorAll("#projectsList b").length === 0);

    // ---- Verlauf ----
    document.querySelector('[data-view="verlauf"]').click();
    await new Promise(r=>setTimeout(r, 300));
    pruefeDialog("Alle drei Verlaufs-Diagramme gezeichnet",
      !!document.querySelector("#vlUmsatzChart svg") &&
      !!document.querySelector("#vlVertriebChart svg") &&
      !!document.querySelector("#vlStundenChart svg"));
    pruefeDialog("Umsatz-Kennzahl steht oben", /3\.800/.test(document.getElementById("vlUmsatzKennzahl").textContent));
    pruefeDialog("Zeitraum wird genannt", /2026/.test(document.getElementById("vlZeitraum").textContent));

    // Personenschalter
    document.getElementById("vlPerson").value = "tim";
    document.getElementById("vlPerson").dispatchEvent(new Event("change"));
    await new Promise(r=>setTimeout(r, 150));
    pruefeDialog("Personenschalter wirkt", /Teamzahlen/.test(document.getElementById("vlStundenSub").textContent));
    document.getElementById("vlPerson").value = "team";
    document.getElementById("vlPerson").dispatchEvent(new Event("change"));
    await new Promise(r=>setTimeout(r, 100));

    // CSV-Export: Download abfangen und den Inhalt pruefen
    let csv = null;
    const echtesCreate = URL.createObjectURL;
    URL.createObjectURL = (blob)=>{ csv = blob; return "blob:test"; };
    const echterClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function(){};
    document.getElementById("vlExport").click();
    await new Promise(r=>setTimeout(r, 100));
    URL.createObjectURL = echtesCreate;
    HTMLAnchorElement.prototype.click = echterClick;
    const text = csv ? await csv.text() : "";
    pruefeDialog("CSV wird erzeugt", text.split("\n").length > 20);
    pruefeDialog("CSV nutzt Semikolon", text.split("\n")[0].split(";").length === 11);
    pruefeDialog("CSV nutzt Komma als Dezimaltrennzeichen", !/\d+\.\d/.test(text));
  }catch(e){
    window.__dialogChecks.push("Dialogpruefung abgebrochen: " + (e && e.message));
  }
  // Zurueck auf den Ausgangsreiter und ausrudern lassen. Die abschliessende
  // Kontrolle des Markups in assert-smoke.py liest den fertigen Seitenzustand
  // — landet sie mitten in einem Neuzeichnen, meldet sie Fehler, die keine
  // sind. Genau das ist einmal passiert.
  try{
    document.querySelector('[data-view="aufgaben"]').click();
    await new Promise(r=>setTimeout(r, 600));
  }catch(e){ /* egal, der Bericht folgt trotzdem */ }
  window.__dialogFertig = true;
}, 1200);

/* Ergebnis ausgeben, sobald die Pruefungen durch sind.
   Bewusst nicht nach fester Zeit: Sonst wird der Bericht mitten in den
   Pruefungen geschrieben und meldet zu wenige — ein Fehler, der wie ein
   uebersprungener Test aussieht. */
(async ()=>{
  const bis = Date.now() + 20000;
  while(!window.__dialogFertig && !window.__nurAnsicht && Date.now() < bis){
    await new Promise(r=>setTimeout(r, 100));
  }
  const el = document.getElementById("smokeResult");
  const errs = window.__errors;
  const dlgFehler = (window.__dialogChecks||[]).filter(c=>!c.endsWith(": ok"));
  const alle = errs.concat(dlgFehler);
  el.textContent = alle.length
    ? "SMOKE: " + alle.length + " FEHLER\n" + alle.join("\n")
    : "SMOKE: OK — keine Fehler | Dialog: " + (window.__dialogChecks||[]).length + " Pruefungen bestanden";
  el.style.color = alle.length ? "#f66" : "#0f0";
})();
</script>
