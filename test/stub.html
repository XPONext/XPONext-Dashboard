<div id="smokeResult" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#111;color:#0f0;font:12px monospace;padding:8px;white-space:pre-wrap;">SMOKE: laeuft…</div>
<script>
/* Rauchtest: ersetzt Supabase durch Fake-Daten und sammelt alle Fehler. */
window.__errors = [];
function rec(e){ window.__errors.push(String(e)); }
window.addEventListener("error", e=>rec(e.message));
window.addEventListener("unhandledrejection", e=>rec((e.reason&&e.reason.stack)||e.reason));
console.error = (...a)=>rec("console.error: "+a.map(String).join(" "));
window.prompt = ()=> "TESTSECRET";
window.alert = m=>rec("alert: "+m);
window.confirm = ()=> true;

const FAKE = {
  daily_personal: [
    {date:"2026-08-10", person:"tim",   lead_gen_hours:8,  hebel:{callBreakdowns:1.5, coachings:0.5}},
    {date:"2026-08-11", person:"simon", lead_gen_hours:6,  hebel:{offer:2, zielgruppe:1}},
    {date:"2025-01-05", person:"tim",   lead_gen_hours:3,  hebel:{}}
  ],
  daily_team: [
    {date:"2026-08-10", termine_gebucht:5, termine_showup:3, closes:[2500, 1800]},
    {date:"2026-08-12", termine_gebucht:2, termine_showup:2, closes:[]}
  ],
  time_entries: [
    {id:1, person:"tim",   ts:new Date().toISOString(), duration_minutes:30, state:"Deepwork",      zuordnung:"XPO",       aktivitaet:"Copywriting"},
    {id:2, person:"simon", ts:new Date().toISOString(), duration_minutes:30, state:"Kommunikation", zuordnung:"Neukunden", aktivitaet:"Vertrieb"},
    {id:3, person:"tim",   ts:new Date().toISOString(), duration_minutes:30, state:"Pause",         zuordnung:null,        aktivitaet:null}
  ],
  tasks: [
    {id:"t1", text:"Angebot <b>schreiben</b>", status:"inarbeit", assignee:"tim", priority:"hoch", done:false, week_start:"2026-08-10", created_at:"2026-08-10T08:00:00Z"},
    {id:"t2", text:"Landingpage", status:"done", assignee:"simon", priority:"niedrig", done:true, week_start:"2026-08-10", created_at:"2026-08-10T09:00:00Z"}
  ],
  weekly_goals: [{week_start:"2026-08-10", goal:"Fokus auf Neukunden"}],
  weekly_commitments: [{id:"c1", week_start:"2026-08-10", text:"3x Cold Call", assignee:"simon", done:false, created_at:"2026-08-10T08:00:00Z"},
    {id:"c2", week_start:"2026-08-10", text:"Altes Commitment ohne Zuweisung", done:true, created_at:"2026-08-10T09:00:00Z"}],
  projects: [{id:"p1", title:"Website-Relaunch", description:"Neue Seite", status:"aktiv", owner:"tim", due_date:"2026-09-30", created_at:"2026-08-01T08:00:00Z"}],
  project_steps: [
    {id:"s1", project_id:"p1", text:"Konzept", assignee:"tim", done:true,  created_at:"2026-08-01T08:00:00Z"},
    {id:"s2", project_id:"p1", text:"Umsetzung", done:false, created_at:"2026-08-02T08:00:00Z"}  // ohne assignee: Altbestand
  ]
};

let idZaehler = 100;
function result(table){
  // Bei select kommen die Testdaten zurueck, bei insert/upsert der geschriebene
  // Datensatz mit neuer id — so wie es echtes Supabase mit .select() tut.
  let daten = FAKE[table] ? JSON.parse(JSON.stringify(FAKE[table])) : [];
  const chain = {
    select: ()=>chain, order: ()=>chain, eq: ()=>chain, limit: ()=>chain,
    delete: ()=>{ daten = []; return chain; },
    single: ()=>chain,
    insert: (row)=>{ daten = [Object.assign({id:"neu"+(++idZaehler), created_at:new Date().toISOString()}, row)]; return chain; },
    upsert: (row)=>{ daten = [Object.assign({id:"neu"+(++idZaehler)}, row)]; return chain; },
    update: (row)=>{ daten = [Object.assign({id:"upd"+(++idZaehler)}, row)]; return chain; },
    then: (res)=>Promise.resolve({ data: daten, error: null }).then(res)
  };
  return chain;
}
window.supabase = { createClient: ()=>({ from: result }) };

/* Dialoge pruefen: oeffnen, Pflichtfeld leer absenden, Werte setzen, speichern.
   Ohne diesen Teil wuerde der Test den Modal-Helfer gar nicht anfassen. */
window.__dialogChecks = [];
function pruefeDialog(name, bedingung){ window.__dialogChecks.push(name + (bedingung ? ": ok" : ": FEHLGESCHLAGEN")); }

setTimeout(async ()=>{
  try{
    document.getElementById("openAddTaskBtn").click();
    await new Promise(r=>setTimeout(r, 60));
    const dlg = document.getElementById("appDialog");
    pruefeDialog("Dialog oeffnet", dlg && dlg.open);
    pruefeDialog("Felder gebaut", !!dlg.querySelector('[name="text"]') && !!dlg.querySelector('[name="priority"]'));
    pruefeDialog("Erstes Feld fokussiert", document.activeElement === dlg.querySelector('[name="text"]'));

    // Pflichtfeld leer -> Meldung im Dialog, Dialog bleibt offen
    dlg.querySelector('[data-dlg="submit"]').click();
    await new Promise(r=>setTimeout(r, 60));
    const fehler = dlg.querySelector(".dlg-error");
    pruefeDialog("Pflichtfeld meldet sich", dlg.open && !fehler.hidden);

    // Ausfuellen und speichern
    dlg.querySelector('[name="text"]').value = "Testaufgabe";
    dlg.querySelector('[data-dlg="submit"]').click();
    await new Promise(r=>setTimeout(r, 120));
    pruefeDialog("Dialog schliesst nach Speichern", !dlg.open);

    // Bearbeiten-Dialog mit vorbelegten Werten
    const karte = document.querySelector(".kanban-card");
    karte.click();
    await new Promise(r=>setTimeout(r, 60));
    pruefeDialog("Bearbeiten vorbelegt", dlg.open && dlg.querySelector('[name="text"]').value.length > 0);
    pruefeDialog("Loeschen wird angeboten", !!dlg.querySelector('[data-dlg="delete"]'));
    // Escape schliesst
    dlg.dispatchEvent(new KeyboardEvent("keydown", {key:"Escape", bubbles:true}));
    dlg.close("abbruch");
    await new Promise(r=>setTimeout(r, 60));
    pruefeDialog("Abbruch schliesst", !dlg.open);
  }catch(e){
    window.__dialogChecks.push("Dialogpruefung abgebrochen: " + (e && e.message));
  }
}, 1200);

/* Ergebnis nach dem Rendern ausgeben. */
setTimeout(()=>{
  const el = document.getElementById("smokeResult");
  const errs = window.__errors;
  const dlgFehler = (window.__dialogChecks||[]).filter(c=>!c.endsWith(": ok"));
  const alle = errs.concat(dlgFehler);
  el.textContent = alle.length
    ? "SMOKE: " + alle.length + " FEHLER\n" + alle.join("\n")
    : "SMOKE: OK — keine Fehler | Dialog: " + (window.__dialogChecks||[]).length + " Pruefungen bestanden";
  el.style.color = errs.length ? "#f66" : "#0f0";
}, 3000);
</script>
